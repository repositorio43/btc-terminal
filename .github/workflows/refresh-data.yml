name: Regenerar datos históricos BTC

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Generar data/*.json
        working-directory: scripts
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node build_historical_data.mjs

      - name: Commitear los JSON actualizados
        run: |
          git config user.name "btc-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "chore: refresh historical BTC data"
          git push
